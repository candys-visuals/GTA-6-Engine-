name: GTA 6 Clips

on:
  schedule:
    - cron: "7 * * * *"   # jede Stunde (Minute 7). Pausieren: Actions → GTA 6 Clips → ⋯ → Disable workflow
  workflow_dispatch:       # "Run workflow" = sofort einmal starten

concurrency:
  group: engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      CACHE_KEY: ${{ secrets.CACHE_KEY }}
      STATE_DB: persist/state.db
      TIKTOK_TOKEN_DATEI: persist/tiktok_token.json
    steps:
      - uses: actions/checkout@v4

      - name: Zugangsdaten prüfen
        run: |
          for v in TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET CACHE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v fehlt (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Programme installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat
          pip install -q -r requirements.txt

      - name: Whisper-Modell aus Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Gespeicherten Stand laden
        uses: actions/cache/restore@v4
        with:
          path: persist.enc
          key: persist-${{ github.run_id }}
          restore-keys: persist-

      - name: Entschlüsseln
        run: |
          mkdir -p persist
          if [ -f persist.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CACHE_KEY -in persist.enc | tar -xz -C persist
          fi

      - name: Clips suchen, schneiden, hochladen
        run: python run.py

      - name: Verschlüsseln
        if: always() && env.CACHE_KEY != ''
        run: tar -cz -C persist . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CACHE_KEY -out persist.enc

      - name: Stand speichern
        if: always() && env.CACHE_KEY != ''
        uses: actions/cache/save@v4
        with:
          path: persist.enc
          key: persist-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Videos zum Download bereitstellen (3 Tage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: ausgabe/*.mp4
          retention-days: 3
          if-no-files-found: ignore
